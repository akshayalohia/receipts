# XcodeGen spec: `xcodegen generate` then open MicroFactory.xcodeproj.
# Same sources as Package.swift. To build without an SDK, delete its entry under
# `packages:` and its line under the app target's `dependencies:`.
name: MicroFactory
options:
  bundleIdPrefix: dev.microfactory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    exactVersion: 3.4.0
  WhopCheckout:
    url: https://github.com/whopio/whopsdk-checkout-swift
    from: 0.1.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic

targets:
  MicroFactoryCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MicroFactoryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.microfactory.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  MicroFactory:
    type: application
    platform: iOS
    sources:
      - path: Sources/MicroFactoryApp
        excludes:
          - "Resources/**"
      - path: Sources/MicroFactoryApp/Resources/Config.plist
        buildPhase: resources
    dependencies:
      - target: MicroFactoryCore
      - package: ElevenLabs
        product: ElevenLabs
      - package: WhopCheckout
        product: WhopCheckout
    settings:
      base:
        PRODUCT_NAME: MicroFactory
        PRODUCT_BUNDLE_IDENTIFIER: dev.microfactory.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Micro Factory
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Set your team in Xcode (Signing & Capabilities) or here.
        DEVELOPMENT_TEAM: ""

  MicroFactoryCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MicroFactoryCoreTests
    dependencies:
      - target: MicroFactoryCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.microfactory.coretests

schemes:
  MicroFactory:
    build:
      targets:
        MicroFactory: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MicroFactoryCoreTests
