[project]
name = "micro-factory-backend"
version = "0.1.0"
description = "Micro Factory: factory API service, factory MCP server, Hermes fleet glue"
requires-python = ">=3.12,<3.13"   # matches the python:3.12 Docker image; OCP/pymeshlab wheels pinned for cp312
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "fastmcp>=2.10",
    # factory (BE1) deps, merged from the former backend/factory/REQUIREMENTS.txt
    "cadquery==2.8.*",          # pulls cadquery-ocp 7.9 (OCP wheels)
    "trimesh==5.2.*",
    "manifold3d==3.5.*",
    "pymeshlab==2025.7.*",      # manylinux_2_35 on aarch64 (glibc >= 2.35)
    "numpy==2.5.*",
    "scipy==1.18.*",            # trimesh stable poses / convex hull
    "networkx==3.7.*",          # trimesh hole filling / graph repair
    "rtree==1.4.*",             # trimesh ray casting (wall-thickness check)
    "usd-core==26.11.*",        # USDZ (pxr)
    "paho-mqtt==2.1.*",         # Bambu A1 MQTT
    "google-genai==2.33.*",     # failure check (Gemini Flash vision)
    "Pillow==13.0.*",
    "matplotlib==3.11.*",       # headless PNG render (Agg)
]

[dependency-groups]
dev = [
    "pytest==9.1.*",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
